[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-forge-api"
version = "0.1.0"
description = "FDE Forge AI — API and domain services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.14.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=43.0.0",
  "PyJWT>=2.9.0",
  "httpx>=0.27.0",
  "redis>=5.2.0",
  "celery[redis]>=5.4.0",
  "boto3>=1.35.0",
  "python-multipart>=0.0.12",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.0",
  "openai>=1.54.0",
  "pgvector>=0.3.6",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-exporter-otlp>=1.28.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "email-validator>=2.2.0",
  "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "types-redis",
  "factory-boy>=3.3.0",
  "faker>=30.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["UP047", "UP046", "E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
