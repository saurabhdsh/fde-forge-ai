name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Unit tests
        env:
          APP_ENV: test
          SECRET_KEY: test-secret-key-with-at-least-32-characters
          CSRF_SECRET: test-csrf-secret-with-at-least-32-characters
          DATABASE_URL: postgresql+asyncpg://fde:fde_secret@localhost:5432/fde_forge
          DATABASE_URL_SYNC: postgresql://fde:fde_secret@localhost:5432/fde_forge
        run: >
          pytest -q
          tests/test_security.py
          tests/test_resume_schema.py
          tests/test_document_extraction.py
          tests/test_permissions.py

  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test -- --run
