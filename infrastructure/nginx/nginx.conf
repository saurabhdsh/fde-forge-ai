upstream fde_api {
  server api:8000;
}

upstream fde_web {
  server web:5173;
}

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://fde_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-ID $request_id;
  }

  location / {
    proxy_pass http://fde_web;
    proxy_set_header Host $host;
  }
}
